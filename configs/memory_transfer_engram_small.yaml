# Matched direct-memory-transfer control for generative_memory_engram_small.
# It must reuse the same source Engram checkpoint.  The only architectural
# difference is replacing generative cortex + reader with the legacy direct
# Engram adaptor.

source_training:
  model: Qwen/Qwen3.5-0.8B-Base
  seed: 42
  condition: transferred
  freeze_backbone: true
  max_tokens: 1000000
  seq_len: 256
  batch_size: 4
  grad_accum_steps: 4
  lr: 3.0e-5
  memory_lr: 1.0e-3
  warmup_steps: 20
  table_size: 8192
  d_head: 32
  max_ngram: 3
  heads_per_order: 2
  corpus: wikitext
  log_every: 10
  eval_every: 100

adaptor_training:
  target_model: Qwen/Qwen3.5-0.8B-Base
  seed: 42
  condition: transferred
  architecture: legacy
  max_tokens: 1000000
  seq_len: 256
  batch_size: 4
  grad_accum_steps: 4
  lr: 3.0e-5
  warmup_steps: 20
  corpus: wikitext
  log_every: 10
  eval_every: 100
  skip_final_test_eval: true
