# Small end-to-end pilot: frozen backbone + frozen Engram -> generative
# cortical memory -> reader -> gated residual injection.
#
# The source phase trains only the Engram tables and source adaptor.  The
# second phase reloads those tables with requires_grad=False, so the generator
# can use only causal Engram cues; it cannot use backbone hidden states.

source_training:
  model: Qwen/Qwen3.5-0.8B-Base
  seed: 42
  condition: transferred
  freeze_backbone: true
  max_tokens: 1000000
  seq_len: 256
  batch_size: 4
  grad_accum_steps: 4
  lr: 3.0e-5
  memory_lr: 1.0e-3
  warmup_steps: 20
  table_size: 8192
  d_head: 32
  max_ngram: 3
  heads_per_order: 2
  corpus: wikitext
  log_every: 10
  eval_every: 100

adaptor_training:
  target_model: Qwen/Qwen3.5-0.8B-Base
  seed: 42
  condition: transferred
  architecture: generative
  # This is the main hypothesis condition.  Do not replace with `learned`:
  # learned cues are a capacity control, not a hippocampus-to-cortex transfer.
  generator_cue_source: engram
  reader_type: cross_attention
  generator_num_latents: 4
  generator_hidden_size: 256
  generator_layers: 2
  generator_heads: 4
  generator_cue_window: 3
  max_tokens: 1000000
  seq_len: 256
  batch_size: 4
  grad_accum_steps: 4
  lr: 3.0e-5
  warmup_steps: 20
  corpus: wikitext
  log_every: 10
  eval_every: 100
  skip_final_test_eval: true
