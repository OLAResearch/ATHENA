# Evaluation-only record for the Mistral baseline paired with the historical
# R4 Engram experiment.  No memory or adaptor is enabled in this condition.

evaluation:
  target_model: mistralai/Mistral-7B-v0.3
  seed: 42
  task: nq
  dataset: google-research-datasets/nq_open
  split: validation
  canon_mode: word_boundary
  condition: baseline

