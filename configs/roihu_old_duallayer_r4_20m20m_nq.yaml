# Reproduction of the historical XMemTransfer R4 NQ run.
# Keep this separate from the current 1M-memory experiments.

source_training:
  model: NousResearch/Llama-2-7b-hf
  condition: transferred
  freeze_backbone: true
  max_tokens: 20000000
  seq_len: 2048
  batch_size: 1
  grad_accum_steps: 1
  lr: 3.0e-5
  warmup_steps: 1000
  table_size: 65536
  d_head: 64
  max_ngram: 3
  heads_per_order: 4
  injection_layers: [2, 10]
  adaptor_branches: 4
  canon_mode: word_boundary
  corpus: wikipedia-2021
  wikipedia2021_dataset: null
  wikipedia2021_source_tokenizer: mistralai/Mistral-7B-v0.3
  wikipedia2021_require_tokenizer_match: false
  log_every: 50
  eval_every: 500
  early_stopping_patience: 3

adaptor_training:
  target_model: mistralai/Mistral-7B-v0.3
  max_tokens: 20000000
  seq_len: 2048
  batch_size: 1
  grad_accum_steps: 1
  lr: 3.0e-5
  warmup_steps: 500
  injection_layers: [2, 10]
  adaptor_branches: 4
  canon_mode: word_boundary
  corpus: wikipedia-2021
  wikipedia2021_dataset: null
  wikipedia2021_source_tokenizer: mistralai/Mistral-7B-v0.3
  wikipedia2021_require_tokenizer_match: false
  log_every: 50
  eval_every: 500
  early_stopping_patience: 3
  skip_final_test_eval: true
